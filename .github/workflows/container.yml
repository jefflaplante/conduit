name: Build and Push Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - configs/container/**
      - .github/workflows/container.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: core
            build_tags: ""
            suffix: ""
          - name: full
            build_tags: "with_datadog,with_k8s,with_pagerduty,with_sre,with_mqtt,with_ssh,with_unifi"
            suffix: "-full"
          - name: sre
            build_tags: "with_datadog,with_pagerduty,with_sre"
            suffix: "-sre"
          - name: iot
            build_tags: "with_mqtt,with_unifi"
            suffix: "-iot"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for version info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version information
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "git_tag=${GIT_TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}
            type=sha,prefix=sha-,suffix=${{ matrix.variant.suffix }}
            type=raw,value=${{ matrix.variant.suffix == '' && 'latest' || matrix.variant.name }},enable={{is_default_branch}}

      # conduit-utxe: run the image with its default config and a throwaway
      # env before publishing: /health must return 200 on the EXPOSEd port
      # and the non-root user must be able to create the DB under /data.
      - name: Build smoke-test image (${{ matrix.variant.name }}, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          push: false
          tags: conduit-smoke:${{ matrix.variant.name }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TAGS=${{ matrix.variant.build_tags }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          platforms: linux/amd64

      - name: Smoke test (${{ matrix.variant.name }})
        env:
          IMAGE: conduit-smoke:${{ matrix.variant.name }}
        run: |
          set -euo pipefail
          docker run -d --name conduit-smoke -p 18789:18789 \
            -e ANTHROPIC_API_KEY=sk-ant-smoke-test "$IMAGE"
          trap 'docker logs conduit-smoke 2>&1 | tail -50; docker rm -f conduit-smoke >/dev/null' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18789/health; then ok=1; break; fi
            sleep 1
          done
          echo
          [ "$ok" = 1 ] || { echo "::error::/health did not return 200"; exit 1; }
          docker exec conduit-smoke test -s /data/gateway.db
          docker exec conduit-smoke test -s /data/auth/token_secret
          docker exec conduit-smoke /usr/local/bin/conduit status
          [ "$(docker exec conduit-smoke id -u)" = 1000 ]

      - name: Build and push container image (${{ matrix.variant.name }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            BUILD_TAGS=${{ matrix.variant.build_tags }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}
          platforms: linux/amd64,linux/arm64
