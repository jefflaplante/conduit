# Conduit gateway with Docker Compose or podman-compose (conduit-kl3i).
#
#   cp deploy/conduit.env.example deploy/conduit.env    # add secrets
#   chmod 600 deploy/conduit.env
#   docker compose -f deploy/compose.yaml up -d         # or: podman-compose ...
#   docker compose -f deploy/compose.yaml ps            # STATUS shows (healthy)
#
# State lives in two named volumes: conduit-data (/data: gateway.db and the
# derived search/brain DBs, auth/token_secret, MCP token, .env, conduit.pid)
# and conduit-workspace (/workspace). Back up conduit-data.
# See DEPLOYMENT.md, "Container".
name: conduit

services:
  conduit:
    # Published by .github/workflows/container.yml. Variants: :latest (core),
    # :full, :sre, :iot. Or `docker compose build` from this checkout.
    image: ghcr.io/jefflaplante/conduit:latest
    build:
      context: ..
      dockerfile: Containerfile
      args:
        BUILD_TAGS: ""
    restart: unless-stopped

    # KEY=VALUE secrets expanded into the config's ${VAR} placeholders
    # (braced form only; see reference/guides/ENV_AND_SECRETS.md).
    env_file:
      - ./conduit.env

    # Loopback only; put a TLS reverse proxy in front for remote clients, or
    # change to "18789:18789" to listen on all interfaces.
    ports:
      - "127.0.0.1:18789:18789"

    volumes:
      - conduit-data:/data
      - conduit-workspace:/workspace
      # Your own config instead of the image default (keep "port": 18789,
      # data_dir/database under /data, workspace under /workspace):
      # - ./config.json:/etc/conduit/config.json:ro

    # Same probe as the image HEALTHCHECK, stated here so compose shows it.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:18789/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # SIGTERM drains in-flight turns; the gateway force-exits at 27s.
    stop_signal: SIGTERM
    stop_grace_period: 30s

    # Runs as uid 1000 (image USER) and binds an unprivileged port.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  conduit-data:
  conduit-workspace:
